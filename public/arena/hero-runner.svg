<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 540" width="380" height="540">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff56f6"/>
      <stop offset="1" stop-color="#7a1f9e"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23234a"/>
      <stop offset="1" stop-color="#121226"/>
    </linearGradient>
  </defs>

  <!-- speed shards behind the runner -->
  <g filter="url(#glow)" opacity="0.95">
    <polygon points="20,250 170,232 168,240 30,262" fill="#99ee2d"/>
    <polygon points="0,320 150,300 150,308 8,332" fill="#406aff"/>
    <polygon points="40,392 175,372 172,380 50,404" fill="#ff56f6"/>
    <polygon points="300,90 352,40 344,72 372,52 330,118" fill="#99ee2d"/>
    <polygon points="318,470 368,420 360,452 380,440 340,498" fill="#406aff"/>
    <polygon points="10,160 60,140 58,148 16,170" fill="#e1bf47"/>
  </g>

  <!-- jacket tail, flying back -->
  <polygon points="232,290 300,318 286,330 304,350 240,338" fill="#5b1679"/>
  <polygon points="232,290 300,318 286,330" fill="#ff56f6" opacity="0.6"/>

  <!-- back leg -->
  <polygon points="190,330 222,334 205,420 236,470 214,478 176,420" fill="url(#pants)"/>
  <polygon points="205,420 236,470 222,474" fill="#2f2f63"/>
  <polygon points="212,470 262,474 266,494 206,492" fill="#15151f"/>
  <polygon points="206,492 266,494 268,500 204,499" fill="#99ee2d" filter="url(#glow)"/>

  <!-- back arm -->
  <polygon points="222,182 252,196 270,252 300,276 290,290 254,266 232,214" fill="#7a1f9e"/>
  <polygon points="290,276 312,272 316,292 294,298" fill="#c9875f"/>

  <!-- torso / jacket -->
  <polygon points="168,170 236,170 252,250 236,338 176,340 158,252" fill="url(#jacket)"/>
  <polygon points="168,170 204,172 196,250 158,252" fill="#ff8bf9" opacity="0.55"/>
  <polygon points="204,172 236,170 252,250 214,246" fill="#5b1679" opacity="0.6"/>
  <polygon points="176,300 236,298 236,338 176,340" fill="#3a0f52"/>
  <line x1="203" y1="176" x2="200" y2="334" stroke="#99ee2d" stroke-width="3" filter="url(#glow)"/>
  <polygon points="170,262 196,258 194,270 170,274" fill="#99ee2d"/>

  <!-- front leg, striding forward -->
  <polygon points="176,330 214,336 196,398 132,444 118,428 166,390" fill="url(#pants)"/>
  <polygon points="166,390 196,398 150,430" fill="#2f2f63"/>
  <polygon points="96,424 140,432 134,454 88,448" fill="#15151f"/>
  <polygon points="88,448 134,454 132,460 84,454" fill="#99ee2d" filter="url(#glow)"/>

  <!-- front arm, swung back-forward -->
  <polygon points="172,184 146,200 120,250 96,262 104,278 134,262 160,214" fill="#e23ee0"/>
  <polygon points="120,250 146,236 160,214 134,262" fill="#ff8bf9" opacity="0.5"/>
  <polygon points="84,262 104,256 110,276 90,282" fill="#c9875f"/>

  <!-- hood and head -->
  <polygon points="170,110 210,92 244,112 248,168 236,182 172,180 160,148" fill="#2a0f3d"/>
  <polygon points="170,110 210,92 214,120 172,138" fill="#4a1a66"/>
  <polygon points="176,132 232,128 236,168 184,174" fill="#c9875f"/>
  <polygon points="176,132 232,128 232,140 178,146" fill="#99ee2d" filter="url(#glow)"/>
  <polygon points="184,160 214,158 212,166 186,168" fill="#8a5a3c"/>
  <polygon points="236,112 260,150 250,176 240,170" fill="#1c0a2a"/>

  <!-- ground glow -->
  <ellipse cx="180" cy="505" rx="130" ry="10" fill="#99ee2d" opacity="0.18"/>
</svg>
