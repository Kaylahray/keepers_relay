[workspace]
exclude = ["rally-wasm"]
resolver = "2"

members = [
  "contracts/common",
  "contracts/game-api",
  "contracts/rally-core",
  "contracts/rally",
  "contracts/live-match",
  "tests",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
ckb-std = { version = "=1.1.0", default-features = false, features = ["allocator", "ckb-types", "type-id", "dummy-atomic"] }
blake2b-ref = { version = "0.3.1", default-features = false }
# The game call: live-match is the client, the game it names is the server.
ckb-script-ipc = "=1.1.1"
ckb-script-ipc-common = "=1.1.1"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# The signed-moves check recovers a key inside the finish: built for speed it costs about 7M cycles
# instead of 13M. Everything else, the rally game included, stays built for size.
[profile.release.package.k256]
opt-level = 3
[profile.release.package.elliptic-curve]
opt-level = 3
[profile.release.package.crypto-bigint]
opt-level = 3
[profile.release.package.ecdsa]
opt-level = 3
