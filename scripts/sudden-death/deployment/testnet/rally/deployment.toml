# Crown Rally on Pudge testnet: the match script and the race game it replays.
# migrations/ holds what is deployed; ckb-cli writes it on apply. Paths are WSL paths: ckb-cli is
# built in WSL (~/ckb-cli/target/release/ckb-cli). The key cells' proxy lock is already deployed,
# in ../proxy-lock/.
#
# Deploy (WSL), after `make build` in scripts/sudden-death and passing tests:
#
#   cd /mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/deployment/testnet/rally
#   mkdir -p migrations
#   export CKB_CLI_HOME=/mnt/c/Users/chiom/.ckb-cli
#   cli="$HOME/ckb-cli/target/release/ckb-cli --url https://testnet.ckb.dev"
#   from=ckt1qzda0cr08m85hc8jlnfp3zer7xulejywt49kt2rr0vthywaa50xwsqvu2rela8ce3j70u76uq3js967a3n07wlgf65e4e
#   $cli deploy gen-txs --from-address $from --fee-rate 2000 --deployment-config deployment.toml --migration-dir migrations --info-file info.json
#   $cli deploy sign-txs --from-account $from --info-file info.json --add-signatures
#   $cli deploy apply-txs --migration-dir migrations --info-file info.json
#
# Then `pnpm exec tsx scripts/crowns-testnet/env-from-migration.ts` prints the lines for .env.local.

# The match script: holds the entries and pays whoever the race says won. Upgradable in place.
[[cells]]
name = "live-match"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/live-match" }

# The race game, found by its data hash. A new road or rule is a new cell; a match names the game it
# was opened on, so open matches keep the rules they started with.
[[cells]]
name = "rally"
enable_type_id = false
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/rally" }

# Owner of the deployed cells: the same ckb-cli account as the Crowns deploy.
[lock]
code_hash = "0x9bd7e06f3ecf4be0f2fcd2188b23f1b9fcc88e5d4b65a8637b17723bbda3cce8"
args = "0x9c50f3fe9f198cbcfe7b5c046502ebdd8cdfe77d"
hash_type = "type"
