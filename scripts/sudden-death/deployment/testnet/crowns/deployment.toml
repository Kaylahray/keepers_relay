# The Crowns and Duels scripts on Pudge testnet. migrations/ holds what is deployed now, so
# running ckb-cli here upgrades the type-id scripts in place and replaces a changed game cell.
# Paths are WSL paths: ckb-cli is built in WSL (~/ckb-cli/target/release/ckb-cli).

[[cells]]
name = "match-type"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/match-type" }

[[cells]]
name = "bid-type"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/onchain/bid-type" }

[[cells]]
name = "treasury-lock"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/onchain/treasury-lock" }

# bid-type, treasury-lock and duel-type point at copies of their deployed code in build/onchain:
# a rebuild only moves panic line numbers in them, so ckb-cli leaves them alone.

# Duels: the escrow script (both the duel cell and the racer cells)...
[[cells]]
