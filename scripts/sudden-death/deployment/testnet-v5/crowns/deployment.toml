# Crowns v5 and Duels on Pudge testnet: five NEW cells in one transaction.
# This directory has its own migrations/ on purpose, as v4's did: pointing ckb-cli at another
# version's migrations would turn this into an upgrade of that version's cells.
# Paths are WSL paths: ckb-cli is built in WSL (~/ckb-cli/target/release/ckb-cli).
#
# The lane-runner game is byte-for-byte v4's (data hash 0xfb9dda09…), so it is not deployed again:
# v5 uses v4's cell, referenced by data hash.

[[cells]]
name = "match-type"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/match-type" }

[[cells]]
name = "bid-type"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/bid-type" }

[[cells]]
name = "treasury-lock"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/treasury-lock" }

# Duels: the escrow script (both the duel cell and the racer cells)...
[[cells]]
name = "duel-type"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/duel-type" }

# ...and the artillery game it replays, referenced by data hash like the lane runner.
[[cells]]
name = "artillery"
enable_type_id = false
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/artillery" }

