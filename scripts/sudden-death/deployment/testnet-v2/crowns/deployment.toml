# Crowns v2 on Pudge testnet: four NEW cells in one transaction.
# This directory has its own migrations/ on purpose. Pointing ckb-cli at the v1 migrations would
# turn this into an upgrade of the live v1 cells and break every v1 crown.
# Paths are WSL paths: ckb-cli is built in WSL (~/ckb-cli/target/release/ckb-cli).

[[cells]]
name = "match-type"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/match-type" }

[[cells]]
name = "bid-type"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/bid-type" }

[[cells]]
name = "treasury-lock"
enable_type_id = true
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/treasury-lock" }

# The game is referenced by data hash, so it needs no type id.
[[cells]]
name = "lane-runner"
enable_type_id = false
location = { file = "/mnt/c/Users/chiom/Desktop/spore/keepers_relay/keepers_relay/scripts/sudden-death/build/release/lane-runner" }

