[package]
name = "crowns-rally-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser and relay build of Crown Rally: the exact rules the game script checks"

[lib]
crate-type = ["cdylib"]

[dependencies]
crowns-rally-core = { path = "../contracts/rally-core" }

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
