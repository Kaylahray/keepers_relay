[package]
name = "crowns-crown-run-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser build of Crown Run: the exact rules the game script checks"

[lib]
crate-type = ["cdylib"]

[dependencies]
crowns-crown-run-core = { path = "../contracts/crown-run-core" }

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
