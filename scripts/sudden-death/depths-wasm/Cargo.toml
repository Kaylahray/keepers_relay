[package]
name = "crowns-depths-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser build of Crown Depths: the exact rules the game script checks"

[lib]
crate-type = ["cdylib"]

[dependencies]
crowns-depths-core = { path = "../contracts/depths-core" }

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
